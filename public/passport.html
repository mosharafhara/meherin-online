<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসপোর্ট সাইজ ফটো অর্ডার - Meherin Online Center</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #07080b; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px 10px; }
        .wrapper { width: 100%; max-width: 500px; padding: 2px; background: linear-gradient(135deg, #e91e63, #9c27b0, #2196f3, #00bcd4); border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9); }
        .container { width: 100%; background: #07080b; border-radius: 18px; overflow: hidden; text-align: center; padding-bottom: 25px; }
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        
        .top-banner { width: 100%; background-color: #07080b; padding: 0; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .top-banner img { width: 100%; height: auto; display: block; object-fit: cover; }
        
        .header-section { background: #07080b; padding: 20px 15px 15px 15px; display: flex; flex-direction: column; align-items: center; }
        .circle-logo-container { width: 110px; height: 110px; border-radius: 50%; background: linear-gradient(135deg, #2196f3, #e91e63); padding: 3px; box-shadow: 0 0 20px rgba(33, 150, 243, 0.4); margin-bottom: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .circle-logo-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; background-color: #07080b; }
        .header-section h1 { font-size: 22px; margin-bottom: 5px; font-weight: 800; color: #ffffff; letter-spacing: 0.8px; }
        .header-section p { font-size: 15px; color: #00e5ff; font-weight: 600; line-height: 1.4; max-width: 420px; }

        .content { padding: 15px 20px 20px 20px; background: #07080b; }
        
        /* Passport Options Box */
        .print-options-box { background: #12141c; border: 1px solid #2a2d3d; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; }
        .print-options-box label { display: block; font-size: 14px; font-weight: 700; color: #00e5ff; margin-bottom: 8px; }
        .print-options-box select { width: 100%; padding: 10px; background: #07080b; border: 1px solid #2196f3; color: #ffcc00; border-radius: 8px; font-size: 15px; font-weight: 700; outline: none; }
        .print-options-box option { background: #07080b; color: #ffffff; }

        /* File Upload Area */
        .custom-file-upload { border: 2px dashed #2196f3; border-radius: 10px; padding: 20px 15px; text-align: center; background-color: #12141c; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; position: relative; }
        .custom-file-upload:hover { background-color: #1a1f2c; border-color: #00e5ff; }
        .custom-file-upload i { font-size: 32px; color: #00e5ff; }
        .file-upload-text { font-size: 15px; font-weight: 700; color: #ffffff; }
        
        /* Preview Image Styling */
        #imagePreview { display: none; width: 100px; height: 120px; object-fit: cover; border-radius: 8px; border: 2px solid #00e5ff; margin-top: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .selected-file-name { font-size: 13px; font-weight: 700; color: #ffcc00; word-break: break-all; }
        
        /* Hidden input file but accessible */
        input[type="file"] { display: none; }

        .error-border { border-color: #ff4d4d !important; background-color: #2c1a1d !important; }
        .error-message { display: none; background-color: #3b191e; color: #ff6b6b; border: 1px solid #7a252b; padding: 12px 16px; border-radius: 10px; font-size: 15px; font-weight: 600; margin-bottom: 18px; align-items: center; justify-content: center; gap: 10px; text-align: center; }

        .btn-submit { width: 100%; background: linear-gradient(90deg, #2196f3, #e91e63); color: white; border: none; padding: 16px; font-size: 18px; font-weight: 800; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3); margin-top: 10px; }

        /* Animated Progress Bar Styling */
        .progress-container { display: none; margin-bottom: 18px; background: #12141c; border: 1px solid #2196f3; border-radius: 12px; overflow: hidden; padding: 4px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.8); }
        .progress-bar { 
            width: 0%; 
            height: 24px; 
            background: linear-gradient(135deg, #00e5ff 0%, #2196f3 50%, #e91e63 100%); 
            background-size: 200% 200%;
            animation: gradientMove 1.5s ease infinite;
            border-radius: 8px; 
            text-align: center; 
            font-size: 13px; 
            font-weight: 900; 
            line-height: 24px; 
            color: #ffffff; 
            transition: width 0.25s ease-out; 
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
            position: relative;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            animation: shimmer 1.2s infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Success Box */
        .success-section { display: none; text-align: center; }
        .white-success-box { background-color: #ffffff; color: #1b5e20; padding: 20px 15px; border-radius: 12px; border: 2px solid #1b5e20; margin-bottom: 15px; }
        .white-success-box h2 { color: #1b5e20; font-size: 22px; margin-bottom: 5px; font-weight: 800; }
        
        .contact-section { text-align: center; padding: 18px 10px 10px 10px; background: #07080b; border-top: 1px solid #161923; display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 20px; }
        .social-title { font-size: 16px; color: #e1bee7; font-weight: 700; }
        .social-icons { display: flex; justify-content: center; gap: 18px; }
        .social-icon { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; color: white; font-size: 22px; text-decoration: none; }
        .whatsapp { background-color: #25d366; } 
        .facebook { background-color: #1877f2; } 
        .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container" id="mainContainer">
            
            <!-- Top Banner -->
            <div class="top-banner">
                <img src="banner.jpg" alt="Meherin Online Center Banner" onerror="this.style.display='none'">
            </div>

            <!-- Header Section -->
            <div class="header-section" id="headerSection">
                <div class="circle-logo-container">
                    <img src="profile.jpg" alt="Logo" onerror="this.src='banner.jpg'; this.onerror=null;">
                </div>
                <h1>PASSPORT PHOTO SERVICE</h1>
                <p>পাসপোর্ট সাইজ ছবির জন্য আপনার ছবি আপলোড করুন</p>
            </div>

            <div class="content" id="form-container">
                
                <div class="error-message" id="errorBox">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">দয়া করে একটি ছবি সিলেক্ট করুন!</span>
                </div>

                <form id="uploadForm">
                    
                    <!-- Copies Selection Box -->
                    <div class="print-options-box">
                        <label for="passportCopies"><i class="fas fa-copy"></i> কত কপি ছবি লাগবে নির্বাচন করুন:</label>
                        <select id="passportCopies">
                            <option value="4">৪ কপি (4 Copies)</option>
                            <option value="8" selected>৮ কপি (8 Copies)</option>
                            <option value="12">১২ কপি (12 Copies)</option>
                            <option value="16">১৬ কপি (16 Copies)</option>
                            <option value="20">২০ কপি (Full Sheet A4)</option>
                        </select>
                    </div>

                    <!-- Custom File Upload Box -->
                    <div class="custom-file-upload" id="fileBox" onclick="document.getElementById('file').click()">
                        <i class="fas fa-camera-retro" id="uploadIcon"></i>
                        <span class="file-upload-text" id="fileTextDisplay">ছবি সিলেক্ট করতে এখানে স্পর্শ করুন</span>
                        <img id="imagePreview" alt="Preview">
                        <span class="selected-file-name" id="fileNameDisplay"></span>
                    </div>
                    <!-- Standard input file without complex restrictions -->
                    <input type="file" id="file" accept="image/*">

                    <!-- Animated Progress Bar Container -->
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar">0%</div>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fas fa-cloud-upload-alt"></i> পাসপোর্ট ফটো জমা দিন
                    </button>
                </form>

                <!-- Success Section -->
                <div class="success-section" id="successSection">
                    <div class="white-success-box">
                        <h2>ধন্যবাদ!</h2>
                        <p style="font-size: 15px; font-weight: 700;">আপনার পাসপোর্ট ছবির অর্ডার সফলভাবে জমা হয়েছে। এখনই প্রিন্ট করা হচ্ছে।</p>
                    </div>
                    <button type="button" class="btn-submit" onclick="location.reload()" style="background: #2a2d3d; color: #ffcc00;">
                        আরেকটি ছবি আপলোড করুন
                    </button>
                </div>
            </div>

            <!-- Social Footer -->
            <div class="contact-section">
                <div class="social-title">আমাদের সাথে সামাজিক মাধ্যমে যুক্ত থাকুন</div>
                <div class="social-icons">
                    <a href="https://wa.me/+918346042954" target="_blank" class="social-icon whatsapp" title="WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                    <a href="https://facebook.com/mosharaf.pathan.7" target="_blank" class="social-icon facebook" title="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="https://instagram.com/mosharafpathan" target="_blank" class="social-icon instagram" title="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('file');
        const fileBox = document.getElementById('fileBox');
        const fileTextDisplay = document.getElementById('fileTextDisplay');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const imagePreview = document.getElementById('imagePreview');
        const uploadIcon = document.getElementById('uploadIcon');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');
        const mainContainer = document.getElementById('mainContainer');
        const submitBtn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const successSection = document.getElementById('successSection');
        const passportCopies = document.getElementById('passportCopies');

        // File Selection & Preview Handler
        fileInput.addEventListener('change', function() {
            if (fileInput.files && fileInput.files.length > 0) {
                const file = fileInput.files[0];

                errorBox.style.display = 'none';
                fileBox.classList.remove('error-border');
                fileTextDisplay.style.display = 'none';
                uploadIcon.style.display = 'none';
                fileNameDisplay.textContent = file.name;

                // Show Image Preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!fileInput.files || fileInput.files.length === 0) {
                errorText.textContent = 'দয়া করে প্রথমে আপনার একটি ছবি সিলেক্ট করুন!';
                errorBox.style.display = 'flex';
                fileBox.classList.add('error-border');
                mainContainer.classList.add('shake');
                setTimeout(() => mainContainer.classList.remove('shake'), 400);
                return;
            }

            const file = fileInput.files[0];

            errorBox.style.display = 'none';
            fileBox.classList.remove('error-border');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> আপলোড হচ্ছে...';
            progressContainer.style.display = 'block';

            let progress = 5;
            progressBar.style.width = progress + '%';
            progressBar.textContent = progress + '%';

            const progressInterval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.floor(Math.random() * 8) + 4;
                    if (progress > 90) progress = 90;
                    progressBar.style.width = progress + '%';
                    progressBar.textContent = progress + '%';
                }
            }, 100);

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64String = event.target.result.split(',')[1];
                const copies = passportCopies.value;
                const modifiedFileName = `Passport_${copies}copies_${file.name}`;
                
                const payload = {
                    filename: modifiedFileName,
                    mimeType: file.type || 'image/jpeg',
                    base64: base64String,
                    folderType: 'passport'
                };

                const scriptURL = 'https://script.google.com/macros/s/AKfycbwkF2cxdCbIZCNAIk0IiPWms7VBZEXRAYXkC6lyRBILGgJgbCH9yNsCyh3k3OFlJHQQ/exec';

                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                })
                .then(() => {
                    clearInterval(progressInterval);
                    progressBar.style.width = '100%';
                    progressBar.textContent = '100%';
                    setTimeout(() => {
                        form.style.display = 'none';
                        successSection.style.display = 'block';
                        progressContainer.style.display = 'none';
                    }, 450);
                })
                .catch(error => {
                    clearInterval(progressInterval);
                    progressContainer.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'পাসপোর্ট ফটো জমা দিন';
                    alert('আপলোড করতে সমস্যা হয়েছে, আবার চেষ্টা করুন।');
                });
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
