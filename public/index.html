<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meherin Online Center</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px;
        }

        .wrapper {
            width: 100%;
            max-width: 500px;
            padding: 2px;
            background: linear-gradient(135deg, #e91e63, #9c27b0, #2196f3, #00bcd4);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .container {
            width: 100%;
            background: #0a0b0e;
            border-radius: 18px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 25px;
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .top-banner {
            width: 100%;
            background-color: #0a0b0e;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid #1f222e;
            overflow: hidden;
        }

        .top-banner img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .header-section {
            background: #000000;
            padding: 25px 15px 15px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid #1f222e;
        }

        .circle-logo-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2196f3, #e91e63);
            padding: 3px;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.4);
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .circle-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #12141c;
        }

        .header-section h1 {
            font-size: 25px;
            margin-bottom: 8px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
        }

        .header-section p {
            font-size: 16px;
            color: #00e5ff;
            font-weight: 600;
            line-height: 1.4;
            max-width: 420px;
        }

        .content {
            padding: 25px 20px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 800;
            margin-bottom: 10px;
            font-size: 18px;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        input[type="file"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #2a2d3d;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background-color: #12141c;
            color: #ffffff;
        }

        .error-border {
            border-color: #ff4d4d !important;
            background-color: #2c1a1d !important;
        }

        .error-message {
            display: none;
            background-color: #3b191e;
            color: #ff6b6b;
            border: 1px solid #7a252b;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 18px;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #2196f3, #e91e63);
            color: white;
            border: none;
            padding: 16px;
            font-size: 19px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }

        .btn-success-loading {
            background: linear-gradient(90deg, #2e7d32, #4caf50) !important;
            cursor: not-allowed;
        }

        .btn-error-flash {
            background: linear-gradient(90deg, #d32f2f, #f44336) !important;
        }

        /* Success Screen Styling */
        .success-box {
            display: none;
            text-align: center;
            padding: 35px 20px;
            background-color: #ffffff;
            border-radius: 12px;
            margin: 25px 20px;
        }

        .checkmark-svg {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
        }

        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke: #1b5e20;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: #1b5e20;
            stroke-width: 3;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }

        .success-box h2 {
            color: #1b5e20;
            font-size: 32px;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .success-msg-main {
            color: #1b5e20;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* Animated Auto-Print Instruction Text - Larger Size & Lower Spacing */
        .success-msg-animate {
            color: #000000;
            font-size: 24px; /* 4 sizes larger */
            font-weight: 800;
            margin-top: 15px; /* Pushed down */
            line-height: 1.4;
            animation: textPulse 1.5s infinite ease-in-out;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }

        .contact-section {
            text-align: center;
            padding: 18px 10px 10px 10px;
            border-top: 1px solid #1f222e;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .call-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #0088cc;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
        }

        .social-title {
            font-size: 16px;
            color: #e1bee7;
            font-weight: 700;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            text-decoration: none;
        }

        .whatsapp { background-color: #25d366; }
        .facebook { background-color: #1877f2; }
        .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container" id="mainContainer">
            
            <div class="top-banner">
                <img src="banner.jpg" alt="Meherin Online Center Banner" onerror="this.style.display='none'">
            </div>

            <div class="header-section" id="headerSection">
                <div class="circle-logo-container">
                    <img src="profile.jpg" alt="User Photo" onerror="this.src='banner.jpg'; this.onerror=null;">
                </div>
                <h1>MEHERIN ONLINE CENTER</h1>
                <p>অটোমেটিক প্রিন্ট করার জন্য আপনার ফাইলটি নিচে UPLOAD করুন</p>
            </div>

            <div class="content" id="form-container">
                <div class="error-message" id="errorBox">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">দয়া করে একটি ফাইল নির্বাচন করুন!</span>
                </div>

                <form id="uploadForm">
                    <div class="form-group">
                        <label for="file">ফাইল নির্বাচন করুন (Select File):</label>
                        <input type="file" id="file">
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">ফাইল আপলোড করুন</button>
                </form>
            </div>

            <div class="success-box" id="successScreen">
                <svg class="checkmark-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
                <h2>ধন্যবাদ!</h2>
                <div class="success-msg-main">আপনার ফাইলটি সফলভাবে জমা হয়ে গেছে।</div>
                <div class="success-msg-animate">একটু ধৈর্য্য ধরুন আপনার ফাইলটি অটোমেটিক প্রিন্ট হচ্ছে...</div>
            </div>

            <div class="contact-section">
                <a href="tel:+918346042954" class="call-btn">
                    <i class="fas fa-phone-alt"></i> ফোন করুন
                </a>

                <div class="social-title">আমাদের সাথে সামাজিক মাধ্যমে যুক্ত থাকুন</div>
                
                <div class="social-icons">
                    <a href="https://wa.me/+918346042954" target="_blank" class="social-icon whatsapp" title="WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                    <a href="https://facebook.com/mosharaf.pathan.7" target="_blank" class="social-icon facebook" title="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="https://instagram.com/mosharafpathan" target="_blank" class="social-icon instagram" title="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('file');
        const errorBox = document.getElementById('errorBox');
        const mainContainer = document.getElementById('mainContainer');
        const submitBtn = document.getElementById('submitBtn');
        const headerSection = document.getElementById('headerSection');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (!fileInput.files || fileInput.files.length === 0) {
                errorBox.style.display = 'flex';
                fileInput.classList.add('error-border');
                
                submitBtn.classList.add('btn-error-flash');
                setTimeout(() => {
                    submitBtn.classList.remove('btn-error-flash');
                }, 300);

                mainContainer.classList.add('shake');
                setTimeout(() => {
                    mainContainer.classList.remove('shake');
                }, 400);
                return;
            }

            errorBox.style.display = 'none';
            fileInput.classList.remove('error-border');

            submitBtn.classList.add('btn-success-loading');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ফাইল আপলোড হচ্ছে...';
            submitBtn.disabled = true;

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const base64String = event.target.result.split(',')[1];
                
                const payload = {
                    filename: file.name,
                    mimeType: file.type,
                    base64: base64String
                };

                // 👇 আপনার Google Apps Script এর আসল Web App URL টি এখানে বসাবেন 👇
                const scriptURL = 'https://script.google.com/macros/s/AKfycbwD1BsLtupiVggz4p5P3b9rh7OFUDf4RFP01gg8iHb-oLlavPhO6NACGTozLsInPSo/exec';

                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify(payload)
                })
                .then(() => {
                    headerSection.style.display = 'none';
                    document.getElementById('form-container').style.display = 'none';
                    document.getElementById('successScreen').style.display = 'block';
                })
                .catch(error => {
                    console.error('Error!', error);
                    submitBtn.classList.remove('btn-success-loading');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'ফাইল আপলোড করুন';
                    alert('আপলোড করতে সমস্যা হয়েছে, আবার চেষ্টা করুন।');
                });
            };

            reader.readAsDataURL(file);
        });

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                errorBox.style.display = 'none';
                fileInput.classList.remove('error-border');
            }
        });
    </script>
</body>
</html>
