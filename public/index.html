<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meherin Online Center</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #07080b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px;
        }

        .wrapper {
            width: 100%;
            max-width: 500px;
            padding: 2px;
            background: linear-gradient(135deg, #e91e63, #9c27b0, #2196f3, #00bcd4);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .container {
            width: 100%;
            background: #07080b;
            border-radius: 18px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 25px;
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .top-banner {
            width: 100%;
            background-color: #07080b;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .top-banner img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .header-section {
            background: #07080b;
            padding: 20px 15px 15px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .circle-logo-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2196f3, #e91e63);
            padding: 3px;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.4);
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .circle-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #07080b;
        }

        .header-section h1 {
            font-size: 25px;
            margin-bottom: 8px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
        }

        .header-section p {
            font-size: 16px;
            color: #00e5ff;
            font-weight: 600;
            line-height: 1.4;
            max-width: 420px;
            margin-bottom: 8px;
        }

        /* Glowing Down Arrow Animation */
        .pointing-arrow {
            font-size: 22px;
            color: #00e5ff;
            text-shadow: 0 0 10px #00e5ff;
            animation: bounceArrow 1.2s infinite ease-in-out;
        }

        @keyframes bounceArrow {
            0%, 100% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(6px); opacity: 1; }
        }

        .content {
            padding: 15px 20px 20px 20px;
            background: #07080b;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        /* Compact Custom File Upload Box */
        .custom-file-upload {
            border: 2px dashed #2196f3;
            border-radius: 10px;
            padding: 12px 15px;
            text-align: center;
            background-color: #12141c;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .custom-file-upload:hover {
            background-color: #1a1f2c;
            border-color: #00e5ff;
        }

        .custom-file-upload i {
            font-size: 24px;
            color: #00e5ff;
        }

        .file-upload-text {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .selected-file-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffcc00;
            word-break: break-all;
        }

        /* Hidden standard file input */
        input[type="file"] {
            display: none;
        }

        .error-border {
            border-color: #ff4d4d !important;
            background-color: #2c1a1d !important;
        }

        .error-message {
            display: none;
            background-color: #3b191e;
            color: #ff6b6b;
            border: 1px solid #7a252b;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 18px;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #2196f3, #e91e63);
            color: white;
            border: none;
            padding: 16px;
            font-size: 19px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
            margin-bottom: 12px;
            margin-top: 15px;
        }

        .btn-reset {
            display: none;
            width: 100%;
            background: #2a2d3d;
            color: #ffcc00;
            border: 1px solid #ffcc00;
            padding: 12px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-reset:hover {
            background: #ffcc00;
            color: #07080b;
        }

        .btn-success-loading {
            background: linear-gradient(90deg, #2e7d32, #4caf50) !important;
            cursor: not-allowed;
        }

        .btn-error-flash {
            background: linear-gradient(90deg, #d32f2f, #f44336) !important;
        }

        /* Progress Bar Styling */
        .progress-container {
            display: none;
            margin-bottom: 15px;
            background: #12141c;
            border: 1px solid #2a2d3d;
            border-radius: 10px;
            overflow: hidden;
            padding: 3px;
        }

        .progress-bar {
            width: 0%;
            height: 22px;
            background: linear-gradient(90deg, #00e5ff, #2196f3);
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            line-height: 22px;
            color: #ffffff;
            transition: width 0.2s ease;
        }

        /* Success & Printing inline display area */
        .success-section {
            display: none;
            margin-top: 5px;
        }

        .white-success-box {
            background-color: #ffffff;
            color: #1b5e20;
            padding: 20px 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 2px solid #1b5e20;
            text-align: center;
        }

        .checkmark-svg {
            width: 60px;
            height: 60px;
            margin: 0 auto 8px;
        }

        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke: #1b5e20;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: #1b5e20;
            stroke-width: 3;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }

        .white-success-box h2 {
            color: #1b5e20;
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 800;
        }

        .white-success-box .popup-msg-main {
            color: #1b5e20;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
        }

        .printing-box {
            background: #1a1f2c;
            border: 2px solid #2196f3;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        .printing-text {
            color: #ffcc00;
            font-size: 18px;
            font-weight: 900;
            line-height: 1.4;
            animation: textPulse 1.5s infinite ease-in-out;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #2a2d3d;
            color: #ffffff;
            border: 1px solid #2196f3;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-back:hover {
            background: #2196f3;
            color: #ffffff;
        }

        .contact-section {
            text-align: center;
            padding: 18px 10px 10px 10px;
            background: #07080b;
            border-top: 1px solid #161923;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .social-title {
            font-size: 16px;
            color: #e1bee7;
            font-weight: 700;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            text-decoration: none;
        }

        .whatsapp { background-color: #25d366; }
        .facebook { background-color: #1877f2; }
        .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container" id="mainContainer">
            
            <!-- Top Banner -->
            <div class="top-banner">
                <img src="banner.jpg" alt="Meherin Online Center Banner" onerror="this.style.display='none'">
            </div>

            <!-- Header Section -->
            <div class="header-section" id="headerSection">
                <div class="circle-logo-container">
                    <img src="profile.jpg" alt="User Photo" onerror="this.src='banner.jpg'; this.onerror=null;">
                </div>
                <h1>MEHERIN ONLINE CENTER</h1>
                <p>অটোমেটিক প্রিন্ট করার জন্য আপনার ফাইলটি নিচে UPLOAD করুন</p>
                <div class="pointing-arrow">
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>

            <div class="content" id="form-container">
                <div class="error-message" id="errorBox">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">দয়া করে একটি ফাইল নির্বাচন করুন!</span>
                </div>

                <form id="uploadForm">
                    <div class="form-group" id="fileGroup">
                        <!-- Compact Custom Upload Box Area -->
                        <label for="file" class="custom-file-upload" id="fileBox">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span class="file-upload-text" id="fileTextDisplay">ফাইল সিলেক্ট করুন</span>
                            <span class="selected-file-name" id="fileNameDisplay"></span>
                        </label>

                        <input type="file" id="file">
                        
                        <button type="button" id="resetBtn" class="btn-reset">
                            <i class="fas fa-redo"></i> ফাইল পরিবর্তন করুন
                        </button>
                    </div>

                    <!-- Animated Progress Bar -->
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar">0%</div>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">ফাইল আপলোড করুন</button>
                </form>

                <!-- Success & Printing Section -->
                <div class="success-section" id="successSection">
                    <div class="white-success-box">
                        <svg class="checkmark-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                            <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                            <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                        </svg>
                        <h2>ধন্যবাদ!</h2>
                        <div class="popup-msg-main">আপনার ফাইলটি সফলভাবে জমা হয়ে গেছে।</div>
                    </div>

                    <div class="printing-box">
                        <div class="printing-text">একটু ধৈর্য্য ধরুন আপনার ফাইলটি অটোমেটিক প্রিন্ট হচ্ছে...</div>
                    </div>

                    <button class="btn-back" id="uploadAnotherBtn">
                        <i class="fas fa-arrow-left"></i> আরেকটি ফাইল আপলোড করুন
                    </button>
                </div>
            </div>

            <div class="contact-section">
                <div class="social-title">আমাদের সাথে সামাজিক মাধ্যমে যুক্ত থাকুন</div>
                
                <div class="social-icons">
                    <a href="https://wa.me/+918346042954" target="_blank" class="social-icon whatsapp" title="WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                    <a href="https://facebook.com/mosharaf.pathan.7" target="_blank" class="social-icon facebook" title="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="https://instagram.com/mosharafpathan" target="_blank" class="social-icon instagram" title="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('file');
        const fileBox = document.getElementById('fileBox');
        const fileTextDisplay = document.getElementById('fileTextDisplay');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const errorBox = document.getElementById('errorBox');
        const mainContainer = document.getElementById('mainContainer');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const successSection = document.getElementById('successSection');
        const uploadAnotherBtn = document.getElementById('uploadAnotherBtn');
        const fileGroup = document.getElementById('fileGroup');
        const headerSection = document.getElementById('headerSection');

        // Reset form function
        function resetUploadForm() {
            fileInput.value = '';
            fileTextDisplay.style.display = 'inline';
            fileNameDisplay.textContent = '';
            resetBtn.style.display = 'none';
            progressContainer.style.display = 'none';
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            submitBtn.disabled = false;
            submitBtn.classList.remove('btn-success-loading');
            submitBtn.innerHTML = 'ফাইল আপলোড করুন';
            submitBtn.style.display = 'block';
            fileGroup.style.display = 'block';
            headerSection.style.display = 'flex';
            successSection.style.display = 'none';
            fileBox.classList.remove('error-border');
        }

        uploadAnotherBtn.addEventListener('click', resetUploadForm);

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                errorBox.style.display = 'none';
                fileBox.classList.remove('error-border');
                resetBtn.style.display = 'block';
                fileTextDisplay.style.display = 'none';
                fileNameDisplay.textContent = fileInput.files[0].name;
            } else {
                resetBtn.style.display = 'none';
                fileTextDisplay.style.display = 'inline';
                fileNameDisplay.textContent = '';
            }
        });

        resetBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileTextDisplay.style.display = 'inline';
            fileNameDisplay.textContent = '';
            resetBtn.style.display = 'none';
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (!fileInput.files || fileInput.files.length === 0) {
                errorBox.style.display = 'flex';
                fileBox.classList.add('error-border');
                
                submitBtn.classList.add('btn-error-flash');
                setTimeout(() => {
                    submitBtn.classList.remove('btn-error-flash');
                }, 300);

                mainContainer.classList.add('shake');
                setTimeout(() => {
                    mainContainer.classList.remove('shake');
                }, 400);
                return;
            }

            errorBox.style.display = 'none';
            fileBox.classList.remove('error-border');
            resetBtn.style.display = 'none';

            submitBtn.classList.add('btn-success-loading');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ফাইল আপলোড হচ্ছে...';
            submitBtn.disabled = true;

            progressContainer.style.display = 'block';
            let progress = 0;
            
            const progressInterval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.floor(Math.random() * 8) + 3;
                    if (progress > 90) progress = 90;
                    progressBar.style.width = progress + '%';
                    progressBar.textContent = progress + '%';
                }
            }, 150);

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const base64String = event.target.result.split(',')[1];
                
                const payload = {
                    filename: file.name,
                    mimeType: file.type,
                    base64: base64String
                };

                const scriptURL = 'https://script.google.com/macros/s/AKfycbwD1BsLtupiVggz4p5P3b9rh7OFUDf4RFP01gg8iHb-oLlavPhO6NACGTozLsInPSo/exec';

                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify(payload)
                })
                .then(() => {
                    clearInterval(progressInterval);
                    progressBar.style.width = '100%';
                    progressBar.textContent = '100%';

                    setTimeout(() => {
                        headerSection.style.display = 'none';
                        fileGroup.style.display = 'none';
                        progressContainer.style.display = 'none';
                        submitBtn.style.display = 'none';
                        successSection.style.display = 'block';
                    }, 400);
                })
                .catch(error => {
                    console.error('Error!', error);
                    clearInterval(progressInterval);
                    progressContainer.style.display = 'none';
                    submitBtn.classList.remove('btn-success-loading');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'ফাইল আপলোড করুন';
                    resetBtn.style.display = 'block';
                    alert('আপলোড করতে সমস্যা হয়েছে, আবার চেষ্টা করুন।');
                });
            };

            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
